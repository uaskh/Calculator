name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The assessment brief must never be committed
        run: |
          if git ls-files --error-unmatch docs/brief.md >/dev/null 2>&1; then
            echo "docs/brief.md is tracked; it must stay local (see .gitignore)" >&2
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: backend
      - name: Test with race detector and coverage thresholds
        run: |
          mkdir -p ../coverage/backend
          go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=../coverage/backend/coverage.out ./...
          go test -run='^$' -bench=BenchmarkEvaluate -benchtime=100x ./internal/calc/ | tee ../coverage/backend/bench.txt
          bash ../scripts/coverage-report.sh ../coverage 80 90 5 >> "$GITHUB_STEP_SUMMARY"
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: API black-box tests
        working-directory: backend
        run: go test -race -count=1 ./test/e2e/...
      - name: Browser end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for health checks
        run: docker compose up --detach --wait
      - name: Smoke test through the web container
        run: curl --fail --silent --show-error http://localhost:3000/ > /dev/null
      - name: Stop the stack
        if: always()
        run: docker compose down --remove-orphans
