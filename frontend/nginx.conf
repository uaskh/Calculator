# Serves the single-page app and proxies API calls to the backend service.

# Keep the caller's X-Request-ID; generate one when it is missing.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # A little above the API's HTTP_MAX_BODY_BYTES (4 KiB by default), so the API answers
    # oversized requests with its own problem document.
    client_max_body_size 8k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (inherited by every location below: none of them uses add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # The API sends its own security headers; hide them so the ones above appear once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
    }

    # Fingerprinted build assets never change.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Everything else is the SPA shell; always revalidate it.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
