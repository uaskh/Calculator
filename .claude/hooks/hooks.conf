# Settings for the hooks in this folder. Sourced by bash: keep KEY="value" syntax.
# Claude cannot change this file (see PROTECT_CLAUDE_CONFIG); edit it by hand.

# Component directories, relative to the repository root.
BACKEND_DIR="backend"
FRONTEND_DIR="frontend"

# Block destructive shell commands, edits to secrets/lockfiles/generated files and
# dependency-policy violations (PreToolUse hooks).
GUARDRAILS="on"

# Go dependency policy:
#   stdlib-only   go.mod may not require/replace/tool any module; imports must be standard library
#   no-frameworks modules may be added (after approval), but no web frameworks or routers
#   off           no dependency checks
GO_DEPENDENCY_POLICY="stdlib-only"

# Stop Claude from editing .claude/settings*.json, .claude/hooks/ and .claude/githooks/.
# .claude/settings.json denies the same files ("Edit(...)" rules, which also cover shell
# redirects); remove those rules as well if Claude should maintain these files.
PROTECT_CLAUDE_CONFIG="on"

# Stop hook: when backend/frontend code changed, Claude cannot finish its turn until
# build, vet, type-check, lint and unit tests pass. Retries per stop before giving up.
# To pause it for one turn: touch .claude/.state/skip-quality-gate
QUALITY_GATE="on"
QUALITY_GATE_MAX_RETRIES=3

# Format staged files on every commit (gofmt/goimports and Prettier). The hooks set
# core.hooksPath=.claude/githooks automatically unless the repo has its own git hooks.
FORMAT_ON_COMMIT="on"

# Subagent activity markers older than this many minutes are treated as stale.
SUBAGENT_STALE_MINUTES=120
