services:
  api:
    build:
      context: ./backend
    environment:
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
